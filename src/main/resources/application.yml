server:
  port: ${PORT:8080}

spring:
  datasource:
    # Defaults to local H2 file DB when no env vars are set.
    # On Render, set DB_URL / DB_DRIVER / DB_USERNAME / DB_PASSWORD to point at Postgres instead.
    url: ${DB_URL:jdbc:h2:file:./data/wardrobe;AUTO_SERVER=TRUE}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-before-deploying-anywhere}
    expiration-ms: 604800000 # 7 days
  upload:
    dir: ${UPLOAD_DIR:./uploads}
  cors:
    allowed-origin: ${CORS_ORIGIN:http://localhost:5173} # set to your deployed frontend URL in prod
